<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Start a Project — 99 DOTS Atelier</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Julius+Sans+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#271a15;--bronze:#b87c55;--bronzeL:#c9956a;--pale:rgba(184,124,85,.1);--ease:cubic-bezier(.16,1,.3,1);}
html,body{width:100%;min-height:100%;font-family:'Manrope',sans-serif;background:#faf9f7;color:var(--dark);overflow-x:hidden;}

/* HEADER */
header{position:sticky;top:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(250,249,247,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(39,26,21,.07);}
.logo{text-decoration:none;display:flex;flex-direction:column;gap:2px;}
.logo-name{font-family:'Times New Roman',serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dark);}
.logo-sub{font-size:7px;letter-spacing:.34em;text-transform:uppercase;color:var(--bronze);font-weight:600;}
.hdr-r{display:flex;align-items:center;gap:16px;}
.back-l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(39,26,21,.4);text-decoration:none;}
.lsw{display:flex;gap:4px;align-items:center;}
.lb{font-size:9px;letter-spacing:.15em;font-family:'Manrope',sans-serif;background:none;border:none;cursor:pointer;color:rgba(39,26,21,.3);font-weight:500;padding:3px;}
.lb.on{color:var(--dark);font-weight:700;}
.ld{font-size:8px;color:rgba(39,26,21,.12);}

/* PAGE */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.page{max-width:640px;margin:0 auto;padding:0 32px 48px;}
.right{padding:40px 0 20px;}

/* PAGE TITLE */
.f-kicker{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze);font-weight:600;margin-bottom:8px;display:block;animation:fadeUp .5s var(--ease) .05s both;opacity:0;}
.f-title{font-family:'Julius Sans One',serif;font-size:clamp(28px,5vw,48px);letter-spacing:.04em;text-transform:uppercase;line-height:1;margin-bottom:36px;animation:fadeUp .55s var(--ease) .1s both;opacity:0;}

/* SECTION */
.sec{display:flex;align-items:center;gap:12px;margin:40px 0 24px;opacity:0;transition:opacity .5s,transform .5s;transform:translateY(8px);}
.sec.vis{opacity:1;transform:translateY(0);}
.sec::after{content:'';flex:1;height:1px;background:rgba(39,26,21,.08);}
.sec-n{width:22px;height:22px;border:1px solid var(--bronze);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--bronze);flex-shrink:0;}
.sec-name{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;white-space:nowrap;}

/* FIELDS */
.f{margin-bottom:24px;opacity:0;transition:opacity .4s,transform .4s;transform:translateY(6px);}
.f.vis{opacity:1;transform:translateY(0);}
.f label{display:block;font-size:12px;font-weight:600;color:rgba(39,26,21,.7);margin-bottom:8px;}
.f input,.f textarea{
  display:block;width:100%;background:none;border:none;
  border-bottom:1px solid rgba(39,26,21,.13);
  font-family:'Manrope',sans-serif;font-size:14px;font-weight:300;
  color:var(--dark);-webkit-text-fill-color:var(--dark);
  padding:8px 0;outline:none;transition:border-color .2s;
  -webkit-appearance:none;border-radius:0;
}
.f input:focus,.f textarea:focus{border-bottom-color:var(--bronze);}
/* Bronze when filled — pure CSS, no JS */
.f input:not(:placeholder-shown),
.f textarea:not(:placeholder-shown){
  border-bottom-color:var(--bronze);
  border-bottom-width:1.5px;
}
.f input::placeholder,.f textarea::placeholder{
  font-size:13px;font-weight:300;
  color:rgba(39,26,21,.28);-webkit-text-fill-color:rgba(39,26,21,.28);
}
.f textarea{resize:none;height:72px;line-height:1.7;}
.ferr{font-size:9px;color:#c0392b;margin-top:4px;display:none;}

/* LANGUAGE CHIPS */
.rrow{display:flex;gap:8px;margin-top:6px;}
.rchip{padding:7px 16px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid rgba(39,26,21,.15);background:#faf9f7;color:rgba(39,26,21,.4);cursor:pointer;transition:all .2s;user-select:none;}
.rchip.on{background:var(--bronze);border-color:var(--bronze);color:#fff;}

/* DROPDOWNS */
.dw{position:relative;z-index:10;}
.dw.oz{z-index:100;}
.dtog{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(39,26,21,.15);font-family:'Manrope',sans-serif;font-size:13px;font-weight:300;color:rgba(39,26,21,.3);padding:8px 0;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;outline:none;transition:border-color .2s;}
.dtog.has{color:var(--dark);-webkit-text-fill-color:var(--dark);font-weight:400;border-bottom-color:var(--bronze);border-bottom-width:1.5px;}
.dtog.open{border-bottom-color:var(--bronze);}
.darr{font-size:10px;color:var(--bronze);transition:transform .2s;margin-left:6px;flex-shrink:0;}
.dtog.open .darr{transform:rotate(180deg);}
.dmenu{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid rgba(39,26,21,.1);z-index:200;box-shadow:0 8px 24px rgba(39,26,21,.1);}
.dmenu.open{display:block;animation:fadeDown .18s var(--ease);}
.di{padding:10px 14px;font-size:13px;font-weight:300;cursor:pointer;color:var(--dark);transition:background .12s;}
.di:hover,.di.on{background:var(--pale);color:var(--bronze);}

/* ADDITIONAL SERVICES */
.svc-wrap{position:relative;z-index:10;}
.svc-wrap.oz{z-index:100;}
.svc-tog{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(39,26,21,.15);font-family:'Manrope',sans-serif;font-size:13px;font-weight:300;color:rgba(39,26,21,.3);padding:8px 0;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;outline:none;transition:border-color .2s;}
.svc-tog.has{color:var(--dark);font-weight:400;border-bottom-color:var(--bronze);border-bottom-width:1.5px;}
.svc-tog.open{border-bottom-color:var(--bronze);}
.svc-drop{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid rgba(39,26,21,.1);z-index:200;max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(39,26,21,.1);}
.svc-drop.open{display:block;animation:fadeDown .18s var(--ease);}
.svc-drop label{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;font-weight:300;cursor:pointer;color:var(--dark);transition:background .12s;border-left:2px solid transparent;user-select:none;}
.svc-drop label:hover{background:var(--pale);}
.svc-drop label.on{background:var(--pale);color:var(--bronze);border-left-color:var(--bronze);}
.svc-drop input[type=checkbox]{display:none;}
.svc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.stag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:var(--pale);font-size:10px;font-weight:500;color:var(--bronze);}
.stag-x{cursor:pointer;font-size:13px;opacity:.6;transition:opacity .15s;}
.stag-x:hover{opacity:1;}

/* SUBMIT */
.btn-s{width:100%;padding:18px;background:var(--dark);border:none;color:#fff;font-family:'Manrope',sans-serif;font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:background .3s,letter-spacing .25s;position:relative;overflow:hidden;}
.btn-s::after{content:'';position:absolute;inset:0;background:var(--bronze);transform:translateX(-101%);transition:transform .4s var(--ease);}
.btn-s span{position:relative;z-index:1;}
.btn-s:hover{letter-spacing:.38em;}
.btn-s:hover::after{transform:translateX(0);}
.btn-s:disabled{opacity:.4;cursor:not-allowed;}

/* SUCCESS */
.succ{position:fixed;inset:0;background:#fff;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;}
.succ.show{display:flex;animation:fadeUp .4s var(--ease);}
.succ-close{position:absolute;top:22px;right:28px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(39,26,21,.4);cursor:pointer;border:none;background:none;font-family:'Manrope',sans-serif;}
.succ-close:hover{color:var(--dark);}
.succ-dot{width:10px;height:10px;background:var(--bronze);border-radius:50%;margin:0 auto 24px;}
.succ-k{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze);font-weight:600;margin-bottom:14px;}
.succ-t{font-family:'Julius Sans One',serif;font-size:clamp(22px,4vw,42px);letter-spacing:.05em;text-transform:uppercase;margin-bottom:20px;}
.succ-p{font-size:12px;font-weight:300;color:rgba(39,26,21,.5);line-height:1.9;max-width:400px;margin-bottom:6px;}
.succ-b{font-weight:600;color:var(--dark);margin-top:10px;display:block;}
.succ-back{display:inline-block;margin-top:28px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;color:var(--dark);border-bottom:1px solid var(--bronze);padding-bottom:2px;}

/* MOBILE */
@media(max-width:600px){
  header,.page{padding-left:20px;padding-right:20px;}
  .f label{font-size:13px;}
  .f input,.f textarea{font-size:16px;color:var(--dark);-webkit-text-fill-color:var(--dark);}
  .f input::placeholder,.f textarea::placeholder{font-size:11px;color:rgba(39,26,21,.28);-webkit-text-fill-color:rgba(39,26,21,.28);}
  .dtog{font-size:16px;}
  .dtog.has{font-size:16px;}
  .dtog:not(.has){font-size:11px;}
  .svc-tog{font-size:16px;}
  .svc-tog:not(.has){font-size:11px;}
  .di,.svc-drop label{font-size:14px;padding:11px 14px;}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/"><span class="logo-name">99 DOTS</span><span class="logo-sub">Atelier Design</span></a>
  <div class="hdr-r">
    <div class="lsw">
      <button class="lb on" id="lg-es" onclick="sl('es')">ES</button><span class="ld">·</span>
      <button class="lb" id="lg-en" onclick="sl('en')">EN</button><span class="ld">·</span>
      <button class="lb" id="lg-fr" onclick="sl('fr')">FR</button>
    </div>
    <a class="back-l" href="/" id="aback">← Inicio</a>
  </div>
</header>

<!-- Success -->
<div class="succ" id="succOv">
  <button class="succ-close" id="sClose" onclick="closeSucc()">✕ Cerrar</button>
  <div class="succ-dot"></div>
  <h2 class="succ-t" id="stl"></h2>
  <p class="succ-p" id="s1"></p>
  <p class="succ-p" id="s2"></p>
  <span class="succ-b" id="s3"></span>
  <a class="succ-back" href="/" id="sbk"></a>
</div>

<div class="page">
<main class="right">
  <span class="f-kicker" id="fPkgTop"></span>
  <h1 class="f-title" id="mainTitle">START A PROJECT</h1>

  <!-- 01 Contact -->
  <div class="sec vis" id="secH0"><span class="sec-n">01</span><span class="sec-name" id="sec0">Contact Information</span></div>
  <div class="f vis"><label id="ln">Name *</label><input type="text" id="pkName" autocomplete="name"><div class="ferr" id="en"></div></div>
  <div class="f vis"><label id="lb">Business Name</label><input type="text" id="pkBiz" autocomplete="organization"></div>
  <div class="f vis"><label id="le">Email *</label><input type="email" id="pkEmail" autocomplete="email"><div class="ferr" id="ee"></div></div>
  <div class="f vis"><label id="ll">Where are you located? *</label><input type="text" id="pkLoc" autocomplete="country"><div class="ferr" id="el"></div></div>

  <!-- 02 Project -->
  <div class="sec" id="secH1"><span class="sec-n">02</span><span class="sec-name" id="sec1">Your Project</span></div>
  <div class="f"><label id="lp">Tell us about your project</label><textarea id="pkProject"></textarea><div class="ferr" id="ep"></div></div>

  <div class="f svc-wrap" id="svcWrap">
    <label id="la">Additional Services</label>
    <button type="button" class="svc-tog" id="svcTog" onclick="toggleSvc()">
      <span id="svcLbl">Select additional services</span><span class="darr">↓</span>
    </button>
    <div class="svc-drop" id="svcDrop"></div>
    <div class="svc-tags" id="svcTags"></div>
  </div>

  <div class="f"><label id="lbg">Estimated Budget *</label><input type="text" id="pkBudget"><div class="ferr" id="ebg"></div></div>

  <div class="f dw" id="tlWrap">
    <label id="ltl">Timeline *</label>
    <button type="button" class="dtog" id="tlTog" onclick="toggleDrop('tlM','tlTog','tlWrap')">
      <span id="tlLbl">Select timeline</span><span class="darr">↓</span>
    </button>
    <div class="dmenu" id="tlM"></div>
    <input type="hidden" id="pkTimeline">
    <div class="ferr" id="etl"></div>
  </div>

  <div class="f"><label id="lr">Style References *</label><textarea id="pkRefs"></textarea><div class="ferr" id="er"></div></div>

  <!-- 03 Details -->
  <div class="sec" id="secH2"><span class="sec-n">03</span><span class="sec-name" id="sec2">Final Details</span></div>
  <div class="f"><label id="lig">Instagram Handle</label><input type="text" id="pkIG"></div>

  <div class="f dw" id="cmWrap">
    <label id="lc">Preferred Communication</label>
    <button type="button" class="dtog" id="cmTog" onclick="toggleDrop('cmM','cmTog','cmWrap')">
      <span id="cmLbl">Select option</span><span class="darr">↓</span>
    </button>
    <div class="dmenu" id="cmM"></div>
    <input type="hidden" id="pkComm">
  </div>

  <div class="f">
    <label id="llng">Preferred language to communicate</label>
    <div class="rrow">
      <div class="rchip on" id="rces" onclick="setLP('rces','Spanish')"><span id="rces-t">Spanish</span></div>
      <div class="rchip" id="rcen" onclick="setLP('rcen','English')"><span id="rcen-t">English</span></div>
    </div>
  </div>

  <div class="f"><label id="lo">Other Comments</label><textarea id="pkComments"></textarea></div>
  <button class="btn-s" id="btnS" onclick="doSub()"><span id="btnT">SUBMIT</span></button>
</main>
</div>

<script>
let pkg='Brand Launch',lp='Spanish',lang='en';

const pkgN={
  es:{'Brand Launch':'Lanzamiento de Marca','Website Launch':'Lanzamiento Web','Social Media Setup':'Redes Sociales','Content Production':'Producción de Contenido','Custom Project':'Proyecto Personalizado'},
  en:{'Brand Launch':'Brand Launch','Website Launch':'Website Launch','Social Media Setup':'Social Media','Content Production':'Content Production','Custom Project':'Custom Project'},
  fr:{'Brand Launch':'Lancement de Marque','Website Launch':'Lancement Web','Social Media Setup':'Réseaux Sociaux','Content Production':'Production de Contenu','Custom Project':'Projet Personnalisé'}
};

const T={
es:{bk:'← Volver',ft:'INICIAR PROYECTO',sec:['Datos de contacto','Sobre el proyecto','Para finalizar'],
ln:'Nombre *',lb:'Nombre del Negocio',le:'Email *',ll:'¿Desde dónde nos escribes? *',llng:'¿En qué idioma te sientes más cómodo/a?',
lp:'Háblanos de tu proyecto',la:'Servicios complementarios',lbg:'Inversión prevista *',lt:'Plazos *',lr:'Referencias e inspiración *',lig:'Perfil de Instagram',lc:'¿Cómo prefieres comunicarte con nosotros?',lo:'¿Algo más que quieras añadir?',
pn:'Tu nombre',pb:'Nombre de tu marca o empresa',pe:'tu@email.com',ploc:'Tu ciudad y país',pp:'Cuéntanos qué tienes en mente, cuál es tu marca y qué quieres conseguir',pbg:'Indícanos el rango de inversión con el que trabajas',pr:'Comparte referencias, enlaces o descríbenos la estética que buscas',pig:'@tumarca',po:'¿Algo más que debamos saber antes de comenzar?',
sph:'Selecciona los servicios de tu interés',sel:'seleccionados',
tl:['Flexible','1–2 semanas','1 mes','2–3 meses'],tlph:'¿En qué plazos trabajas?',
cm:['Llamada','Email','WhatsApp'],cmph:'Selecciona tu preferencia',
pl:['Español','English'],
svc:['Branding','Logo','Tarjetas de visita','Brochures','Certificados','Banners','Presentación','Stickers','Menús restaurante y salón','Vallas publicitarias','Recursos gráficos','Diseño web','Landing page','Sitio web multipágina','Gestión Instagram','Sesión fotográfica','Grabación de vídeo','Reels / contenido corto','Setup digital','Otro'],
sub:'ENVIAR',snd:'ENVIANDO...',close:'✕ Cerrar',
sk:'Propuesta en camino',st:'GRACIAS POR CONFIAR EN NOSOTROS',s1:'Tu proyecto ya está en manos del equipo de 99 DOTS.',s2:'En menos de 24 horas recibirás una propuesta diseñada a tu medida.',s3:'Es el momento de conectar los puntos.',sbk:'← Volver al inicio',
e:{n:'Campo requerido',e:'Introduce un email válido',l:'Campo requerido',p:'Cuéntanos sobre tu proyecto',b:'Campo requerido',t:'Indica los plazos',r:'Añade tus referencias de estilo'}},

en:{bk:'← Back',ft:'START A PROJECT',sec:['Contact Information','Your Project','Final Details'],
ln:'Name *',lb:'Business Name',le:'Email *',ll:'Where are you located? *',llng:'Preferred language to communicate',
lp:'Tell us about your project',la:'Additional Services',lbg:'Estimated Budget *',lt:'Timeline *',lr:'Style References *',lig:'Instagram Handle',lc:'Preferred Communication',lo:'Other Comments',
pn:'Your name',pb:'Your brand',pe:'your@email.com',ploc:'Your city and country',pp:'Briefly describe your brand, goals and what you would like to create',pbg:'Specify your investment level',pr:'Share links or a short description',pig:'@yourbrand',po:"Anything else you'd like us to know?",
sph:'Select additional services',sel:'selected',
tl:['Flexible','1–2 weeks','1 month','2–3 months'],tlph:'Select timeline',
cm:['Call','Email','WhatsApp'],cmph:'Select option',
pl:['Spanish','English'],
svc:['Branding','Logo','Business cards','Brochures','Certificates','Banners','Presentation','Stickers','Restaurant & salon menus','Billboards','Custom graphic assets','Web design','Landing page','Multipage website','Instagram management','Photo shooting','Video shooting','Reels / short-form','Digital setup','Other'],
sub:'SUBMIT',snd:'SENDING...',close:'✕ Close',
sk:'We got it',st:'THANK YOU FOR REACHING OUT',s1:'Your project is now in the hands of the 99 DOTS team.',s2:'Expect a bespoke proposal in your inbox within 24 hours.',s3:'Time to connect the dots.',sbk:'← Back to home',
e:{n:'Required',e:'Invalid email',l:'Required',p:'Please describe your project',b:'Required',t:'Please select a timeline',r:'Please add references'}},

ln:'Nom *',lb:'Entreprise / Marque',le:'Email *',ll:'Où êtes-vous basé(e) ? *',llng:'Dans quelle langue souhaitez-vous qu\'on échange ?',
lp:'Parlez-nous de votre projet',la:'Services Supplémentaires',lbg:'Budget estimé *',lt:'Délai *',lr:'Références de style *',lig:'Perfil de Instagram',lc:'Comment préférez-vous qu\'on vous contacte ?',lo:'Commentaires libres',

sph:'Sélectionnez les services qui vous intéressent',sel:'sélectionnés',
tl:['Flexible','1–2 semaines','1 mois','2–3 mois'],tlph:'De quel délai disposez-vous ?',
cm:['Appel','Email','WhatsApp'],cmph:'Choisissez une option',
pl:['Espagnol','Anglais'],
svc:['Branding','Logo','Cartes de visite','Brochures','Certificats','Bannières','Présentation','Stickers','Menus restaurant & salon','Panneaux publicitaires','Ressources graphiques','Web design','Landing page','Site web multi-pages','Gestion Instagram','Séance photo','Tournage vidéo','Reels / contenu court','Setup digital','Autre'],
sub:'ENVOYER',snd:'ENVOI...',close:'✕ Fermer',

e:{n:'Champ obligatoire',e:'Veuillez saisir un email valide',l:'Champ obligatoire',p:'Décrivez votre projet',b:'Champ obligatoire',t:'Sélectionnez un délai',r:'Ajoutez des références de style'}}
};

function dl(){const s=localStorage.getItem('99d_lang');if(s&&['es','en','fr'].includes(s))return s;const b=(navigator.language||'en').toLowerCase();if(b.startsWith('fr'))return'fr';if(b.startsWith('es'))return'es';return'en';}

function sl(l){
  lang=l;localStorage.setItem('99d_lang',l);document.documentElement.lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));
  document.getElementById('lg-'+l).classList.add('on');
  const t=T[l];
  document.getElementById('aback').textContent=t.bk;
  const pkgEl=document.getElementById('fPkgTop');if(pkgEl)pkgEl.textContent=pkgN[l][pkg]||pkg;
  const titleEl=document.getElementById('mainTitle');if(titleEl)titleEl.textContent=t.ft;
  t.sec.forEach((s,i)=>{const e=document.getElementById('sec'+i);if(e)e.textContent=s;});
  const ids={ln:'ln',lb:'lb',le:'le',ll:'ll',llng:'llng',lp:'lp',la:'la',lbg:'lbg',lt:'ltl',lr:'lr',lig:'lig',lc:'lc',lo:'lo'};
  Object.entries(ids).forEach(([k,id])=>{const e=document.getElementById(id);if(e)e.textContent=t[k];});
  const phs={pkName:'pn',pkBiz:'pb',pkEmail:'pe',pkLoc:'ploc',pkProject:'pp',pkBudget:'pbg',pkRefs:'pr',pkIG:'pig',pkComments:'po'};
  Object.entries(phs).forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.placeholder=t[k];});
  document.getElementById('rces-t').textContent=t.pl[0];
  document.getElementById('rcen-t').textContent=t.pl[1];
  document.getElementById('btnT').textContent=t.sub;
  const skEl=document.getElementById('sk');if(skEl)skEl.textContent=t.sk;
  document.getElementById('stl').textContent=t.st;
  document.getElementById('s1').textContent=t.s1;
  document.getElementById('s2').textContent=t.s2;
  document.getElementById('s3').textContent=t.s3;
  document.getElementById('sbk').textContent=t.sbk;
  document.getElementById('sClose').textContent=t.close;
  buildDrops();
}

function setLP(id,v){document.querySelectorAll('.rchip').forEach(r=>r.classList.remove('on'));document.getElementById(id).classList.add('on');lp=v;}

function closeAll(){
  document.querySelectorAll('.dmenu').forEach(m=>m.classList.remove('open'));
  document.querySelectorAll('.dtog').forEach(t=>t.classList.remove('open'));
  document.querySelectorAll('.dw').forEach(d=>d.classList.remove('oz'));
  document.getElementById('svcDrop').classList.remove('open');
  document.getElementById('svcTog').classList.remove('open');
  document.getElementById('svcWrap').classList.remove('oz');
}
document.addEventListener('click',e=>{if(!e.target.closest('.dw')&&!e.target.closest('.svc-wrap'))closeAll();});

function toggleDrop(mid,tid,dwid){
  const isOpen=document.getElementById(mid).classList.contains('open');
  closeAll();
  if(!isOpen){
    document.getElementById(mid).classList.add('open');
    document.getElementById(tid).classList.add('open');
    document.getElementById(dwid).classList.add('oz');
  }
}

function toggleSvc(){
  const isOpen=document.getElementById('svcDrop').classList.contains('open');
  closeAll();
  if(!isOpen){
    document.getElementById('svcDrop').classList.add('open');
    document.getElementById('svcTog').classList.add('open');
    document.getElementById('svcWrap').classList.add('oz');
  }
}

function updateTags(){
  const t=T[lang];
  const checked=Array.from(document.querySelectorAll('#svcDrop input:checked'));
  const tagsEl=document.getElementById('svcTags');
  const tog=document.getElementById('svcTog');
  tagsEl.innerHTML='';
  if(!checked.length){
    document.getElementById('svcLbl').textContent=t.sph;
    tog.classList.remove('has');
  } else {
    document.getElementById('svcLbl').textContent=checked.length+' '+t.sel;
    tog.classList.add('has');
    checked.forEach(cb=>{
      const tag=document.createElement('span');tag.className='stag';
      tag.innerHTML=(cb.dataset.name||cb.value)+'<span class="stag-x" data-v="'+cb.value+'" onclick="removeTag(this)">×</span>';
      tagsEl.appendChild(tag);
    });
  }
}

function removeTag(el){
  const cb=document.querySelector('#svcDrop input[value="'+el.dataset.v+'"]');
  if(cb){cb.checked=false;cb.closest('label').classList.remove('on');}
  updateTags();
}

function buildDrops(){
  const t=T[lang];
  // Timeline
  const tlM=document.getElementById('tlM');
  const tlV=document.getElementById('pkTimeline').value;
  tlM.innerHTML='';
  t.tl.forEach(v=>{
    const d=document.createElement('div');d.className='di'+(tlV===v?' on':'');
    d.textContent=v;
    d.onclick=()=>{
      document.getElementById('pkTimeline').value=v;
      document.getElementById('tlLbl').textContent=v;
      document.getElementById('tlTog').classList.add('has');
      closeAll();
      tlM.querySelectorAll('.di').forEach(x=>x.classList.remove('on'));
      d.classList.add('on');
    };
    tlM.appendChild(d);
  });
  document.getElementById('tlLbl').textContent=tlV||t.tlph;
  document.getElementById('tlTog').classList.toggle('has',!!tlV);
  // Comm
  const cmM=document.getElementById('cmM');
  const cmV=document.getElementById('pkComm').value;
  cmM.innerHTML='';
  t.cm.forEach(v=>{
    const d=document.createElement('div');d.className='di'+(cmV===v?' on':'');
    d.textContent=v;
    d.onclick=()=>{
      document.getElementById('pkComm').value=v;
      document.getElementById('cmLbl').textContent=v;
      document.getElementById('cmTog').classList.add('has');
      closeAll();
      cmM.querySelectorAll('.di').forEach(x=>x.classList.remove('on'));
      d.classList.add('on');
    };
    cmM.appendChild(d);
  });
  document.getElementById('cmLbl').textContent=cmV||t.cmph;
  document.getElementById('cmTog').classList.toggle('has',!!cmV);
  // Svc
  const drop=document.getElementById('svcDrop');
  const prevChecked=new Set(Array.from(document.querySelectorAll('#svcDrop input:checked')).map(c=>c.value));
  drop.innerHTML='';
  t.svc.forEach(name=>{
    const lbl=document.createElement('label');
    const cb=document.createElement('input');cb.type='checkbox';cb.value=name;cb.dataset.name=name;
    if(prevChecked.has(name)){cb.checked=true;lbl.classList.add('on');}
    cb.addEventListener('change',function(){this.closest('label').classList.toggle('on',this.checked);updateTags();});
    lbl.appendChild(cb);lbl.appendChild(document.createTextNode(' '+name));
    drop.appendChild(lbl);
  });
  updateTags();
}

function vld(){
  const t=T[lang];let ok=true;
  function chk(v,id,msg){const e=document.getElementById(id);if(!v){e.textContent=msg;e.style.display='block';ok=false;}else e.style.display='none';}
  chk(document.getElementById('pkName').value.trim(),'en',t.e.n);
  chk(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('pkEmail').value),'ee',t.e.e);
  chk(document.getElementById('pkLoc').value.trim(),'el',t.e.l);
  chk(document.getElementById('pkProject').value.trim(),'ep',t.e.p);
  chk(document.getElementById('pkBudget').value.trim(),'ebg',t.e.b);
  chk(document.getElementById('pkTimeline').value,'etl',t.e.t);
  chk(document.getElementById('pkRefs').value.trim(),'er',t.e.r);
  if(!ok)document.querySelector('.ferr[style*="block"]')?.scrollIntoView({behavior:'smooth',block:'center'});
  return ok;
}

function doSub(){
  if(!vld())return;
  const btn=document.getElementById('btnS'),t=T[lang];
  document.getElementById('btnT').textContent=t.snd;btn.disabled=true;
  const svcs=Array.from(document.querySelectorAll('#svcDrop input:checked')).map(c=>c.dataset.name||c.value).join(', ');
  fetch('https://formspree.io/f/mwvrzyll',{
    method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({package:pkg,name:document.getElementById('pkName').value,business:document.getElementById('pkBiz').value||'—',email:document.getElementById('pkEmail').value,location:document.getElementById('pkLoc').value,preferred_language:lp,about:document.getElementById('pkProject').value,additional_services:svcs||'—',budget:document.getElementById('pkBudget').value,timeline:document.getElementById('pkTimeline').value||'—',references:document.getElementById('pkRefs').value,instagram:document.getElementById('pkIG').value||'—',communication:document.getElementById('pkComm').value||'—',comments:document.getElementById('pkComments').value||'—',timestamp:new Date().toISOString()})
  })
  .then(r=>{
    if(r.ok){document.getElementById('succOv').classList.add('show');}
    else{document.getElementById('btnT').textContent=t.sub;btn.disabled=false;alert('Something went wrong.');}
  })
  .catch(()=>{document.getElementById('btnT').textContent=T[lang].sub;btn.disabled=false;alert('Connection error.');});
}

function closeSucc(){document.getElementById('succOv').classList.remove('show');}

// Scroll reveal
const ro=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');ro.unobserve(e.target);}});},{threshold:.1});
document.querySelectorAll('.sec,.f').forEach(el=>{if(!el.classList.contains('vis'))ro.observe(el);});

// URL param
const pm={'brand-launch':'Brand Launch','website-launch':'Website Launch','social-media':'Social Media Setup','content':'Content Production','custom':'Custom Project'};
const pp=new URLSearchParams(window.location.search).get('pkg');
if(pp&&pm[pp])pkg=pm[pp];

lang=dl();sl(lang);
</script>
